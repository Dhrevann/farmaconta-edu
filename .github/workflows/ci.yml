name: FarmaConta EDU - Integridad
on:
  push:
    branches: [main, release/3-0-consolidacion]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  static-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Comprobar estructura, preguntas y seguridad
        run: node --test tests/smoke.mjs
